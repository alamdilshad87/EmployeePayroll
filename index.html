<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Payroll</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- UC-1: Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo-content">
        <img src="assests\images\app.png" alt="Employee Payroll Logo">
        <div>
          <span class="emp-text">EMPLOYEE</span><br>
          <span class="emp-text emp-payroll">PAYROLL</span>
        </div>
      </div>
    </div>
  </header>

  <!-- UC-2: Employee Payroll Form -->
<div class="form-content">
  <form class="form" action="#" onsubmit="return false">

    <div class="form-head">
      Employee Payroll Form
    </div>

    <div class="row-content">
      <label class="label text" for="name">Name</label>
      <input
        class="input"
        type="text"
        id="name"
        name="name"
        placeholder="Your name..."
        required
      />
    </div>

    <!-- UC-3: Profile Image -->
    <div class="row-content">
        <label class="label text" for="profile">Profile image</label>

        <div class="profile-radio-content">

            <label>
            <input type="radio" name="profile" value="./assets/profile-images/Ellipse-3.png" required>
            <img class="profile" src="assests\profile\img1.png" alt="profile-1">
            </label>

            <label>
            <input type="radio" name="profile" value="./assets/profile-images/Ellipse-1.png">
            <img class="profile" src="assests\profile\img2.png" alt="profile-2">
            </label>

            <label>
            <input type="radio" name="profile" value="./assets/profile-images/Ellipse-8.png">
            <img class="profile" src="assests\profile\img3.png" alt="profile-3">
            </label>

            <label>
            <input type="radio" name="profile" value="./assets/profile-images/Ellipse-7.png">
            <img class="profile" src="assests\profile\img4.png" alt="profile-4">
            </label>
        </div>
    </div>

    <!-- UC-4: Gender -->
    <div class="row-content">
        <label class="label text" for="gender">Gender</label>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label class="text" for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label class="text" for="female">Female</label>
        </div>
    </div>
    <!-- UC-4: Department -->
    <div class="row-content">
        <label class="label text" for="department">Department</label>
        <div>
            <input class="checkbox" type="checkbox" id="hr" name="hr" value="HR">
            <label class="text" for="hr">HR</label>

            <input class="checkbox" type="checkbox" id="sales" name="sales" value="Sales">
            <label class="text" for="sales">Sales</label>

            <input class="checkbox" type="checkbox" id="finance" name="finance" value="Finance">
            <label class="text" for="finance">Finance</label>

            <input class="checkbox" type="checkbox" id="engineer" name="engineer" value="Engineer">
            <label class="text" for="engineer">Engineer</label>

            <input class="checkbox" type="checkbox" id="others" name="others" value="Others">
            <label class="text" for="others">Others</label>
        </div>
    </div>

   <!-- UC-4: Salary -->
    <div class="row-content">
        <label class="label text" for="salary">Salary</label>

        <select class="select" id="salary" name="salary">
            <option value="select">Select Salary</option>
            <option value="300000">300000</option>
            <option value="400000">400000</option>
            <option value="500000">500000</option>
            <option value="600000">600000</option>
            <option value="700000">700000</option>
        </select>
    </div>

    <!-- UC-5: Start Date -->
    <div class="row-content">
        <label class="label text" for="startDate">Start Date</label>

        <select class="select date-select" name="day" id="day">
            <option value="">Day</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
            <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
            <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
            <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
            <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
            <option>31</option>
        </select>

        <select class="select date-select" name="month" id="month">
            <option value="">Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>

        <select class="select date-select" name="year" id="year">
            <option value="">Year</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
            <option>2023</option>
            <option>2024</option>
            <option>2025</option>
        </select>
    </div>
        
    <!-- UC-6: Notes -->
    <div class="row-content">
        <label class="label text" for="notes">Notes</label>
        <textarea
            class="input"
            id="notes"
            name="notes"
            placeholder="Enter notes"
            rows="4">
        </textarea>
    </div>

    <!-- UC-6: Action Buttons -->
    <div class="button-parent">
        <button type="button" class="button cancelButton">Cancel</button>

        <div class="button-group">
            <button type="submit" class="button submitButton">Submit</button>
            <button type="reset" class="button resetButton">Reset</button>
            
        </div>
    </div>

  </form>
</div>

</body>
</html>
